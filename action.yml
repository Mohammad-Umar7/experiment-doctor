name: Experiment Doctor CI Gate
description: Block pull requests that silently break a Flagsmith experiment (renamed conversion events, flag read before identify, events never flushed, and more).
author: Team FirstCommit
branding:
  icon: activity
  color: purple
inputs:
  base:
    description: Git ref to compare against. Defaults to the pull request base branch.
    required: false
    default: ""
  fail-on:
    description: "Lowest severity of a NEW finding that fails the check: critical, warning or info."
    required: false
    default: critical
  min-confidence:
    description: New findings below this confidence (0 to 1) never fail the check.
    required: false
    default: "0.8"
runs:
  using: node24
  main: packages/action/dist/main.js
